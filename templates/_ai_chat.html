{# AI chat widget — talks to our chatbot backend (../chatbot) and answers
   from this hotel's documents. Replaces the old Bitrix24 live-chat widget. #}
<style>
  .cb-launcher {
    position: fixed; bottom: 24px; right: 24px;
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(145deg, #7d6a47, #5c4d33);
    color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(92,77,51,.45);
    z-index: 9998;
    animation: cb-pulse 2.2s ease-out infinite;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .cb-launcher:hover { transform: scale(1.08); box-shadow: 0 8px 24px rgba(92,77,51,.55); }
  .cb-launcher:active { transform: scale(.96); }
  .cb-launcher svg { width: 30px; height: 30px; display: block; }
  /* once the chat is open, calm it down */
  .cb-launcher.cb-open { animation: none; }
  .cb-launcher.cb-open .cb-badge { display: none; }

  /* blinking "online" dot */
  .cb-badge {
    position: absolute; top: 3px; right: 3px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #4ade80; border: 2px solid #fff;
    animation: cb-blink 1.4s ease-in-out infinite;
  }

  @keyframes cb-pulse {
    0%   { box-shadow: 0 6px 18px rgba(92,77,51,.45), 0 0 0 0 rgba(125,106,71,.5); }
    70%  { box-shadow: 0 6px 18px rgba(92,77,51,.45), 0 0 0 16px rgba(125,106,71,0); }
    100% { box-shadow: 0 6px 18px rgba(92,77,51,.45), 0 0 0 0 rgba(125,106,71,0); }
  }
  @keyframes cb-blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .3; transform: scale(.85); }
  }
  /* respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    .cb-launcher, .cb-badge { animation: none; }
  }
  .cb-panel {
    position: fixed; bottom: 96px; right: 24px;
    width: 370px; max-width: calc(100vw - 32px);
    height: 540px; max-height: calc(100vh - 130px);
    background: #fff; border-radius: 20px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(40,32,18,.32);
    display: none; flex-direction: column; z-index: 9999;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    transform-origin: bottom right;
  }
  .cb-panel.open { display: flex; animation: cb-pop .22s ease-out; }
  @keyframes cb-pop { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }

  /* ---- Header with profile ---- */
  .cb-header {
    background: linear-gradient(135deg, #7d6a47, #5c4d33); color: #fff;
    padding: 14px 14px; display: flex; align-items: center; gap: 11px;
  }
  .cb-avatar {
    border-radius: 50%; flex: 0 0 auto;
    background-color: #5c4d33; background-size: cover; background-position: center;
  }
  .cb-header .cb-avatar {
    width: 40px; height: 40px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    border: 2px solid rgba(255,255,255,.75);
  }
  .cb-header-info { display: flex; flex-direction: column; line-height: 1.25; }
  .cb-header-name { font-weight: 600; font-size: .97rem; }
  .cb-header-status { font-size: .74rem; opacity: .9; display: flex; align-items: center; gap: 5px; }
  .cb-header-status .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: cb-blink 1.6s ease-in-out infinite; }
  .cb-close {
    margin-left: auto; background: transparent; border: none; color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer; opacity: .85;
    width: 30px; height: 30px; border-radius: 8px;
  }
  .cb-close:hover { opacity: 1; background: rgba(255,255,255,.16); }

  /* ---- Messages ---- */
  .cb-messages {
    flex: 1; overflow-y: auto; padding: 16px 14px; background: #f6f3ec;
    display: flex; flex-direction: column; gap: 12px;
  }
  .cb-row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; animation: cb-rise .2s ease-out; }
  .cb-row.bot { justify-content: flex-start; }
  .cb-row.guest { justify-content: flex-end; }
  @keyframes cb-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .cb-row .cb-avatar {
    width: 30px; height: 30px; align-self: flex-end;
  }
  .cb-msg { max-width: 76%; padding: 10px 13px; border-radius: 16px; line-height: 1.45; font-size: .93rem; white-space: pre-wrap; }
  .cb-msg.bot  { background: #fff; border: 1px solid #ece6da; border-bottom-left-radius: 5px; color: #2b241a; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .cb-msg.guest { background: linear-gradient(145deg, #7d6a47, #5c4d33); color: #fff; border-bottom-right-radius: 5px; }
  .cb-sources { font-size: .7rem; color: #b3a894; margin: -6px 0 0 38px; }

  /* ---- Typing indicator ---- */
  .cb-typing-bubble { background: #fff; border: 1px solid #ece6da; border-radius: 16px; border-bottom-left-radius: 5px; padding: 12px 14px; display: flex; gap: 4px; }
  .cb-typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: #b3a894; animation: cb-bounce 1.2s infinite ease-in-out; }
  .cb-typing-bubble span:nth-child(2) { animation-delay: .15s; }
  .cb-typing-bubble span:nth-child(3) { animation-delay: .3s; }
  @keyframes cb-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* ---- Input ---- */
  .cb-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ece6da; background: #fff; }
  .cb-input input { flex: 1; padding: 11px 14px; border: 1px solid #d7cfbf; border-radius: 22px; font-size: .95rem; outline: none; }
  .cb-input input:focus { border-color: #6b5b3e; box-shadow: 0 0 0 3px rgba(107,91,62,.12); }
  .cb-input button { background: linear-gradient(145deg, #7d6a47, #5c4d33); color: #fff; border: none; border-radius: 22px; padding: 0 18px; cursor: pointer; font-size: .95rem; font-weight: 500; }
  .cb-input button:hover:not(:disabled) { filter: brightness(1.08); }
  .cb-input button:disabled { opacity: .5; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .cb-panel.open, .cb-row, .cb-typing-bubble span, .cb-header-status .dot { animation: none; }
  }
</style>

<button class="cb-launcher" id="cbLauncher" aria-label="Open chat">
  <span class="cb-badge"></span>
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#fff" d="M12 3C6.48 3 2 6.86 2 11.6c0 2.3 1.05 4.37 2.77 5.9-.1 1.2-.5 2.52-1.33 3.6-.24.3-.02.74.37.68 2-.3 3.47-1.02 4.46-1.64 1.13.37 2.37.56 3.73.56 5.52 0 10-3.86 10-8.6S17.52 3 12 3Z"/>
    <circle cx="8" cy="11.6" r="1.25" fill="#5c4d33"/>
    <circle cx="12" cy="11.6" r="1.25" fill="#5c4d33"/>
    <circle cx="16" cy="11.6" r="1.25" fill="#5c4d33"/>
  </svg>
</button>
<div class="cb-panel" id="cbPanel">
  <div class="cb-header">
    <span class="cb-avatar" style="background-image:url('{{ chatbot.avatar_url }}')"></span>
    <div class="cb-header-info">
      <span class="cb-header-name">{{ hotel_name }}</span>
    </div>
    <button class="cb-close" id="cbClose" aria-label="Close chat">&times;</button>
  </div>
  <div class="cb-messages" id="cbMessages"></div>
  <form class="cb-input" id="cbForm">
    <input id="cbInput" type="text" placeholder="Ask a question…" autocomplete="off" />
    <button type="submit" id="cbSend">Send</button>
  </form>
</div>

<script>
  const API_URL = "{{ chatbot.api_url }}";
  const HOTEL_ID = "{{ chatbot.hotel_id }}";
  const GREETING = "Hello! 👋 I'm the virtual assistant for {{ hotel_name }}. Ask me about rooms, breakfast, parking, pets, or anything about your stay.";

  // Profile picture for the assistant's message avatar.
  const AVATAR_URL = "{{ chatbot.avatar_url }}";
  const AVATAR_HTML = '<span class="cb-avatar" style="background-image:url(\'' + AVATAR_URL + '\')"></span>';

  const panel = document.getElementById("cbPanel");
  const launcher = document.getElementById("cbLauncher");
  const messagesEl = document.getElementById("cbMessages");
  const form = document.getElementById("cbForm");
  const input = document.getElementById("cbInput");
  const sendBtn = document.getElementById("cbSend");
  const closeBtn = document.getElementById("cbClose");

  let history = [];
  let greeted = false;

  function openPanel() {
    panel.classList.add("open");
    launcher.classList.add("cb-open");  // stop pulse/badge once opened
    if (!greeted) { addMessage("bot", GREETING); greeted = true; }
    input.focus();
  }
  function closePanel() {
    panel.classList.remove("open");
    launcher.classList.remove("cb-open");
  }
  launcher.addEventListener("click", () => {
    panel.classList.contains("open") ? closePanel() : openPanel();
  });
  closeBtn.addEventListener("click", closePanel);

  function addMessage(who, text, sources) {
    const row = document.createElement("div");
    row.className = "cb-row " + (who === "guest" ? "guest" : "bot");

    if (who !== "guest") {
      const av = document.createElement("span");
      av.className = "cb-avatar";
      av.style.backgroundImage = "url('" + AVATAR_URL + "')";
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "cb-msg " + (who === "guest" ? "guest" : "bot");
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage("guest", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;

    const typing = document.createElement("div");
    typing.className = "cb-row bot";
    typing.innerHTML =
      AVATAR_HTML +
      '<div class="cb-typing-bubble"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hotel_id: HOTEL_ID, message: text, history: history.slice(0, -1) }),
      });
      typing.remove();
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      addMessage("bot", data.answer, data.sources);
      history.push({ role: "assistant", content: data.answer });
    } catch (err) {
      typing.remove();
      addMessage("bot", "Sorry, I had trouble connecting. Please try again, or call reception on 01234 567890.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
